# P04 LLM Gateway Lab —— 仅模式 C 需要
# 跑一行：docker-compose up -d
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: p04-postgres
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    ports:
      - "5432:5432"
    volumes:
      - p04_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: p04-redis
    ports:
      - "6379:6379"
    volumes:
      - p04_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  p04_pgdata:
  p04_redisdata:
