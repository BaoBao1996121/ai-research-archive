- id: q010
  question: "HyDE 查询改写适合什么场景？什么场景反而会变差？"
  difficulty: hard
  category: conceptual
  must_contain: []
  ground_truth_keywords: ["hyde", "假答案", "长尾", "事实"]
  reference_answer: "HyDE 适合长尾、概念性、问题与文档措辞差异大的场景；对简单事实题（如人名、日期、定义）反而会变差，因为生成的假答案可能引入噪声词。"

- id: q011
  question: "Ollama 在 Windows 下设置 OLLAMA_MODELS 环境变量为什么 setx 不生效？正确做法是什么？"
  difficulty: hard
  category: factual
  must_contain: ["explorer", "session"]
  ground_truth_keywords: ["setx", "explorer", "session", "ollama serve"]
  reference_answer: "Windows 已登录会话的 explorer.exe 不刷新注册表环境变量，从开始菜单启动的 Ollama Desktop 继承的是 explorer 旧环境。正确做法是在当前 PowerShell 会话用 $env:OLLAMA_MODELS 设置，再用 ollama serve 命令行启动。"

