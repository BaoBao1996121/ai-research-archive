- id: q001
  question: "PSEV 框架的四个阶段分别是什么？"
  difficulty: easy
  category: factual
  must_contain: ["Profile", "Strategy", "Execute", "Verify"]
  ground_truth_keywords: ["psev", "画像", "策略", "执行", "验证"]
  reference_answer: "PSEV 是 Profile（画像）→ Strategy（策略）→ Execute（执行）→ Verify（验证）四阶段决策框架。"

- id: q002
  question: "EDD 协议要求每次提交前必须做什么？"
  difficulty: easy
  category: factual
  must_contain: ["Eval", "通过率"]
  ground_truth_keywords: ["edd", "eval gate", "ci"]
  reference_answer: "EDD 协议要求每次提交前必须运行 Eval 集，跑硬断言、LLM judge 软断言，并对比新旧版本输出回归数。"

- id: q003
  question: "本知识库中目前有几个 Skill？分别叫什么名字？"
  difficulty: medium
  category: factual
  must_contain: ["skill"]
  ground_truth_keywords: ["skill-evaluator", "tech-selector", "knowledge-base-organizer", "source-code-dissector", "agent-harness-scaffolder"]
  reference_answer: "目前包含 5 个 Skill：knowledge-base-organizer、skill-evaluator、tech-selector、source-code-dissector、agent-harness-scaffolder。"

- id: q004
  question: "RAG 中 Hybrid 检索为什么要用 RRF 融合，而不是直接加权求和？"
  difficulty: medium
  category: conceptual
  must_contain: ["RRF", "尺度"]
  must_not_contain: []
  ground_truth_keywords: ["排名", "rank", "尺度", "余弦", "bm25"]
  reference_answer: "Dense 余弦分数在 [0,1]，BM25 分数在 [0,+∞)，尺度差异巨大，加权求和会被 BM25 主导。RRF 只看排名不看绝对分数，自然抹平尺度差异。"

- id: q005
  question: "在 8GB 显卡上跑 LLM，为什么 24GB 的 MoE 模型可能比 17GB 的稠密模型还快？"
  difficulty: hard
  category: conceptual
  must_contain: ["MoE", "稀疏", "激活"]
  ground_truth_keywords: ["moe", "稀疏激活", "offload", "io"]
  reference_answer: "MoE 模型每次只激活一小部分参数（稀疏激活），CPU offload 时 IO 量降到约 1/9，所以即使总参数量更大反而更快。"

- id: q006
  question: "Anthropic 提出的 Contextual Retrieval 核心做法是什么？为什么有效？"
  difficulty: hard
  category: conceptual
  must_contain: ["上下文", "chunk"]
  ground_truth_keywords: ["上下文", "chunk", "embedding", "anthropic"]
  reference_answer: "在 embedding 之前用 LLM 给每个 chunk 添加 50-100 字的上下文说明（如出处、所述对象），再做 embedding 和 BM25。这解决了 chunk 脱离上下文导致检索失败的问题，官方数据显示 top-20 召回失败率降低 49%。"

- id: q007
  question: "Skill 应该用 Why 驱动还是用 MUST/ALWAYS 堆规则？为什么？"
  difficulty: medium
  category: conceptual
  must_contain: ["why", "解释"]
  ground_truth_keywords: ["why", "anthropic", "解释", "原则"]
  reference_answer: "应该用 Why 驱动。Anthropic Skill-Creator 的设计哲学之一是解释 Why 比堆 MUST/ALWAYS 更重要——因为模型理解了原则就能在新场景下推广，而僵硬的规则会在边界场景失效。"

